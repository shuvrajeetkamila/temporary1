name: Qatar Android APK

on:
  push:
    branches: ["arena/3b05e45c-temporary1"]
    paths:
      - "qatar-android/**"
      - ".github/workflows/qatar-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-stage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qatar-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reset current QA state
        run: rm -rf artifacts && mkdir -p artifacts
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee artifacts/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -i '^(FAILURE:|\* What went wrong:|\* Exception is:|.*(error:|Caused by:|Execution failed|cannot find|not found|unsupported).*)' artifacts/gradle.log > artifacts/gradle-root-cause.log || true
            tail -n 100 artifacts/gradle.log > artifacts/gradle-failure-tail.log
            echo "::group::Gradle root cause"
            cat artifacts/gradle-root-cause.log artifacts/gradle-failure-tail.log
            echo "::endgroup::"
            detail=$(tr '\n' ' ' < artifacts/gradle-root-cause.log | cut -c1-6000)
            echo "::error file=qatar-android/artifacts/gradle.log,title=Gradle APK build root cause::$detail"
            exit "$status"
          fi
      - name: Validate packaged world gate
        run: |
          test "$(sed -n '1p' app/src/main/assets/world/qatar_world_manifest.txt)" = "QTRWORLD"
          test "$(sed -n '3p' app/src/main/assets/world/qatar_world_manifest.txt)" -ge 8
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Stage current build only
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Qatar-The-Peninsula-v0.1.0-toolchain-debug.apk
          sha256sum artifacts/Qatar-The-Peninsula-v0.1.0-toolchain-debug.apk > artifacts/Qatar-The-Peninsula-v0.1.0-toolchain-debug.apk.sha256
          unzip -t artifacts/Qatar-The-Peninsula-v0.1.0-toolchain-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qatar-The-Peninsula-build-diagnostics
          path: qatar-android/artifacts/
          if-no-files-found: error
