plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.shuvrajeet.qatarpeninsula'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.shuvrajeet.qatarpeninsula'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-toolchain'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
